# render.yaml — Render.com Blueprint
# Declares both the backend web service and (optionally) a managed Postgres DB.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chimera-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: CHIMERA
      # DATABASE_URL is auto-injected by Render when you link the database below.
      # For the free tier (no Postgres), leave DATABASE_URL unset and SQLite will be used.
      # Note: SQLite data is EPHEMERAL on Render free tier — use Postgres for persistence.
      - key: DATABASE_URL
        fromDatabase:
          name: chimera-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/chimera-uploads
      - key: CORS_ORIGINS
        value: https://chimera-frontend.vercel.app  # ← replace with your real Vercel URL
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: ENABLE_LLM
        value: "false"

databases:
  - name: chimera-db
    plan: free          # Render free Postgres (expires after 90 days; upgrade for production)
    databaseName: chimera
    user: chimera
